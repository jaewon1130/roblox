<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="RIVALS 밈 성격 유형 검사" />
  <title>나의 RIVALS 유형은?</title>
  <style>
    :root { --ink:#17223b; --blue:#4b70ff; --violet:#8055ff; --mint:#54dfbd; --paper:#f7f9ff; --card:#fff; --muted:#65708c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; background:radial-gradient(circle at 8% 8%,#d8e4ff 0 10%,transparent 28%),radial-gradient(circle at 92% 90%,#dfffe9 0 10%,transparent 28%),var(--paper); }
    button { font:inherit; }
    .wrap { width:min(100% - 32px,720px); margin:0 auto; padding:34px 0 52px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:900; letter-spacing:.08em; color:var(--blue); }
    .brand-mark { display:grid; place-items:center; width:31px; height:31px; color:#fff; background:linear-gradient(135deg,var(--blue),var(--violet)); border-radius:10px; box-shadow:0 8px 18px #4b70ff55; }
    .screen { display:none; animation:up .35s ease both; }
    .screen.active { display:block; }
    @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .hero { padding:62px 20px 30px; text-align:center; }
    .eyebrow { display:inline-block; margin:0 0 14px; padding:7px 11px; border-radius:999px; background:#e9edff; color:#4b57b8; font-weight:800; font-size:13px; }
    h1 { margin:0; font-size:clamp(32px,8vw,54px); line-height:1.11; letter-spacing:-.07em; }
    .hero h1 span { color:var(--blue); }
    .lead { margin:18px auto 28px; max-width:430px; color:var(--muted); line-height:1.65; font-size:16px; word-break:keep-all; }
    .cta, .secondary { min-height:54px; border:0; border-radius:16px; cursor:pointer; font-weight:900; transition:transform .15s,box-shadow .15s; }
    .cta { padding:0 25px; color:#fff; background:linear-gradient(135deg,var(--blue),var(--violet)); box-shadow:0 12px 24px #5868d955; }
    .cta:hover,.secondary:hover,.answer:hover { transform:translateY(-2px); }
    .cta:focus-visible,.secondary:focus-visible,.answer:focus-visible { outline:3px solid #ffcf48; outline-offset:3px; }
    .tip { margin:18px 0 0; color:#7c86a1; font-size:13px; }
    .mini-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:480px; margin:32px auto 0; }
    .mini { aspect-ratio:1; display:grid; place-items:center; border-radius:18px; background:#fff; box-shadow:0 7px 18px #243c7720; font-size:25px; transform:rotate(var(--r)); }
    .mini:nth-child(1){--r:-5deg}.mini:nth-child(2){--r:4deg}.mini:nth-child(3){--r:-3deg}.mini:nth-child(4){--r:5deg}
    .test-card,.result-card { margin-top:26px; padding:clamp(23px,5vw,42px); border:1px solid #e4e9f5; border-radius:28px; background:var(--card); box-shadow:0 18px 45px #24416d18; }
    .status { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:14px; font-weight:800; color:var(--muted); }
    .bar { height:9px; overflow:hidden; margin:13px 0 35px; border-radius:999px; background:#e9edf7; }
    .bar > i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--mint)); transition:width .25s ease; }
    .question-label { margin:0 0 10px; color:var(--blue); font-size:15px; font-weight:900; }
    h2 { margin:0; font-size:clamp(23px,5vw,31px); line-height:1.38; letter-spacing:-.045em; word-break:keep-all; }
    .answers { display:grid; gap:12px; margin-top:29px; }
    .answer { display:flex; align-items:center; width:100%; min-height:67px; padding:14px 17px; border:2px solid #e5eaf5; border-radius:17px; color:var(--ink); text-align:left; background:#fff; cursor:pointer; transition:border-color .15s,background .15s,transform .15s; }
    .answer:hover { border-color:#9cafff; background:#f7f8ff; }
    .letter { flex:0 0 auto; display:grid; place-items:center; width:29px; height:29px; margin-right:13px; border-radius:9px; background:#edf0f9; color:#55617c; font-size:13px; font-weight:900; }
    .answer span:last-child { line-height:1.45; word-break:keep-all; }
    .back { margin-top:20px; padding:7px; border:0; color:#77819a; background:transparent; cursor:pointer; text-decoration:underline; }
    .result-kicker { margin:0 0 8px; color:var(--violet); font-size:14px; font-weight:900; }
    .result-title { margin:0; font-size:clamp(38px,9vw,59px); letter-spacing:-.075em; line-height:1.05; word-break:keep-all; }
    .result-subtitle { margin:12px 0 24px; font-size:20px; font-weight:900; word-break:keep-all; }
    .result-image { position:relative; display:grid; overflow:hidden; width:100%; aspect-ratio:3 / 4; min-height:0; place-items:center; margin:0 0 23px; border-radius:22px; background:var(--fallback,#594dff); isolation:isolate; }
    .result-image img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-1; }
    .result-image.no-image:after { content:"이미지 연결 준비 완료"; padding:8px 12px; border:1px solid #ffffff78; border-radius:999px; color:#fff; background:#00000030; font-size:13px; font-weight:800; }
    .result-image.no-image:before { content:attr(data-icon); color:#fff; font-size:88px; filter:drop-shadow(0 8px 9px #0005); }
    .traits { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
    .trait { padding:8px 11px; border-radius:999px; color:#3d4d87; background:#edf1ff; font-size:14px; font-weight:800; }
    .description { margin:0; color:#53607b; line-height:1.72; font-size:16px; word-break:keep-all; }
    .tie-note { margin:16px 0 0; color:#8791a9; font-size:12px; line-height:1.5; }
    .result-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:25px; }
    .secondary { padding:0 18px; color:#3c4a70; background:#edf1fa; }
    @media (max-width:480px) { .wrap { width:min(100% - 24px,720px); padding-top:22px; } .hero { padding-top:47px; } .test-card,.result-card { border-radius:22px; } .answer { min-height:61px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="brand-mark">R</span> RIVALS TYPE TEST</div>

    <section id="intro" class="screen active" aria-labelledby="intro-title">
      <div class="hero">
        <p class="eyebrow">7문항 · 약 1분</p>
        <h1 id="intro-title">나의 <span>RIVALS</span><br />유형은?</h1>
        <p class="lead">평소 친구들과 있을 때 나는 어떤 모습일까? 가장 나다운 답을 골라 보세요.</p>
        <button id="startButton" class="cta" type="button">검사 시작하기 →</button>
        <p class="tip">정답은 없어요. 너무 오래 고민하지 않아도 됩니다!</p>
        <div class="mini-cards" aria-hidden="true"><div class="mini">⚡</div><div class="mini">🎮</div><div class="mini">🕺</div><div class="mini">🌀</div></div>
      </div>
    </section>

    <section id="quiz" class="screen" aria-live="polite">
      <div class="test-card">
        <div class="status"><span id="counter">1 / 7</span><span>가장 가까운 답 하나만!</span></div>
        <div class="bar" aria-hidden="true"><i id="progress"></i></div>
        <p id="questionLabel" class="question-label"></p>
        <h2 id="questionText"></h2>
        <div id="answers" class="answers"></div>
        <button id="backButton" class="back" type="button">← 이전 질문</button>
      </div>
    </section>

    <section id="result" class="screen" aria-live="polite">
      <div class="result-card">
        <p class="result-kicker">당신의 RIVALS 유형은</p>
        <h1 id="resultTitle" class="result-title"></h1>
        <p id="resultSubtitle" class="result-subtitle"></p>
        <div id="resultImage" class="result-image no-image" data-icon="⚡" aria-label="유형 이미지 영역"></div>
        <div id="traits" class="traits"></div>
        <p id="description" class="description"></p>
        <p id="tieNote" class="tie-note" hidden></p>
        <div class="result-actions">
          <button id="restartButton" class="cta" type="button">다시 해보기 ↻</button>
          <button id="copyButton" class="secondary" type="button">결과 문구 복사</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ─────────────────────────────────────────────────────────────────────
    // 편집 구역 1: 결과 이미지 경로
    // images 폴더에 이미지 8개를 넣은 뒤 아래 image 경로만 실제 파일명으로 바꾸세요.
    // 이미지가 아직 없거나 불러오지 못하면, 각 유형의 색/아이콘 카드가 대신 보입니다.
    // ─────────────────────────────────────────────────────────────────────
    const TYPES = {
      l: { name:"L을 가져가", subtitle:"승부욕 있는 도발가", traits:["🔥 승부욕이 강함", "👑 자신감이 있음"], description:"승부가 시작됐다면 끝까지 존재감을 보여주는 타입! 친한 친구들과의 장난에서도 자신만의 페이스를 놓치지 않아요.", image:"images/l-eul-gajyeoga.png", icon:"🏆", color:"linear-gradient(135deg,#ff7a45,#ef3e72)" },
      criss: { name:"크리스 크로스", subtitle:"분위기 타는 인싸", traits:["🎉 텐션이 높음", "✨ 표현력이 좋음"], description:"분위기가 올라오면 에너지도 함께 올라가요. 친구들이 즐거워하는 모습을 보면 더 신나는 타입입니다.", image:"images/criss-cross.png", icon:"🕺", color:"linear-gradient(135deg,#8055ff,#d65cff)" },
      side: { name:"측면 대 측면", subtitle:"여유로운 개그맨", traits:["😎 침착함", "💬 능청스러움"], description:"급한 상황에서도 한 박자 여유가 있어요. 적당한 한마디로 분위기를 재미있게 만드는 매력이 있습니다.", image:"images/side-by-side.png", icon:"😎", color:"linear-gradient(135deg,#288fdb,#48d8c8)" },
      portal: { name:"포탈 오류", subtitle:"예측할 수 없는 괴짜", traits:["🌀 즉흥적임", "❓ 예측불가"], description:"평범한 상황도 재미있는 방향으로 바꾸는 타입! 친구들이 다음 행동을 예상하기 어려워서 더 눈길이 갑니다.", image:"images/portal-error.png", icon:"🌀", color:"linear-gradient(135deg,#6b40d9,#1678f2)" },
      step: { name:"스텝 댄싱", subtitle:"존재감 넘치는 주인공", traits:["🎤 주도적임", "🌟 존재감이 강함"], description:"재미있다고 생각하면 망설이지 않고 먼저 움직여요. 모임에서 자연스럽게 분위기의 중심이 되는 타입입니다.", image:"images/step-dancing.png", icon:"🎤", color:"linear-gradient(135deg,#f25897,#ffae42)" },
      tango: { name:"탱고", subtitle:"사람 사이를 움직이는 사교가", traits:["🤝 사교성이 좋음", "🎵 분위기를 잘 맞춤"], description:"사람들의 반응을 살피며 자연스럽게 어울려요. 서로 편하게 이야기할 수 있도록 연결해 주는 능력이 있습니다.", image:"images/tango.png", icon:"🤝", color:"linear-gradient(135deg,#f28b39,#ffce4c)" },
      you: { name:"당신에게서", subtitle:"반응이 빠른 리액션 고수", traits:["👀 눈치가 빠름", "⚡ 적응력이 좋음"], description:"친구의 말과 작은 변화도 빠르게 알아차리는 타입! 상황에 맞는 반응으로 대화를 더 즐겁게 이어 갑니다.", image:"images/dangsinegeseo.png", icon:"⚡", color:"linear-gradient(135deg,#13aeb5,#5dd980)" },
      warp: { name:"워프메이커", subtitle:"자기 방식대로 가는 아티스트", traits:["🎨 독창적임", "🛹 자유로운 편"], description:"정해진 답보다 나만의 방법을 먼저 떠올려요. 남들과 다른 시도가 오히려 새로운 재미를 만들어 내는 타입입니다.", image:"images/warp-maker.png", icon:"🎨", color:"linear-gradient(135deg,#3579fc,#3545b8)" }
    };

    // 편집 구역 2: 질문, 선택지, 내부 점수표. 화면에는 유형별 점수가 보이지 않습니다.
    // 형식: { text: "선택지", type: "유형 코드", points: 가중치 }
    const QUESTIONS = [
      { text:"친구들과 약속을 잡았는데, 한 명이 갑자기 ‘나 오늘 못 갈 것 같아’라고 한다.", choices:[
        { text:"아쉽긴 한데 괜찮아. 남은 사람들끼리 재밌게 놀면 되지.", type:"side", points:1 },
        { text:"왜? 무슨 일인데? 일단 상황부터 확인한다.", type:"you", points:1 },
        { text:"오히려 좋아. 갑자기 생긴 빈자리를 어떻게 활용할지 생각한다.", type:"step", points:3 },
        { text:"일단 분위기 안 어색하게 적당히 농담을 던진다.", type:"criss", points:3 }
      ]},
      { text:"발표를 앞두고 있는데, 준비한 자료에서 치명적인 오류를 발견했다.", choices:[
        { text:"일단 침착하게 수정 가능한 부분부터 고친다.", type:"side", points:1 },
        { text:"‘이걸 지금 발견했다고?’ 하면서 일단 웃어버린다.", type:"portal", points:3 },
        { text:"최대한 자연스럽게 발표 내용에 끼워 넣을 방법을 찾는다.", type:"tango", points:2 },
        { text:"아예 발표 흐름을 바꿔서 새로운 방향으로 간다.", type:"warp", points:2 }
      ]},
      { text:"게임에서 상대가 나를 계속 도발한다.", choices:[
        { text:"굳이 반응하지 않고 내 플레이에 집중한다.", type:"you", points:3 },
        { text:"나도 한 번 제대로 받아준다.", type:"l", points:3 },
        { text:"오히려 상대가 당황할 만한 플레이를 시도한다.", type:"portal", points:1 },
        { text:"그냥 웃기니까 같이 즐긴다.", type:"criss", points:2 }
      ]},
      { text:"처음 만난 사람들과 어색한 분위기에서 밥을 먹게 됐다.", choices:[
        { text:"먼저 말을 걸어서 분위기를 풀어본다.", type:"tango", points:1 },
        { text:"다른 사람들이 대화하는 걸 보면서 자연스럽게 끼어든다.", type:"you", points:1 },
        { text:"적당한 타이밍에 한마디 던져서 분위기를 바꾼다.", type:"side", points:3 },
        { text:"굳이 분위기를 바꾸려고 하지 않고 편하게 있는다.", type:"step", points:3 }
      ]},
      { text:"친구가 단체 채팅방에서 갑자기 이상한 말을 했다.", choices:[
        { text:"일단 무슨 뜻인지 물어본다.", type:"you", points:3 },
        { text:"바로 받아쳐서 대화를 이어간다.", type:"l", points:3 },
        { text:"더 이상한 말을 하나 얹는다.", type:"portal", points:3 },
        { text:"일단 지켜보다가 결정적인 순간에 등장한다.", type:"step", points:2 }
      ]},
      { text:"여행 중 계획했던 일정이 갑자기 전부 꼬였다.", choices:[
        { text:"계획을 다시 세운다.", type:"side", points:3 },
        { text:"‘뭐, 이런 것도 여행이지’ 하고 그냥 즐긴다.", type:"tango", points:2 },
        { text:"오히려 원래 계획에 없던 곳을 찾아본다.", type:"warp", points:3 },
        { text:"일단 아무 데나 가보고 그다음 생각한다.", type:"portal", points:1 }
      ]},
      { text:"오랜만에 친구들을 만났는데, 다들 예전보다 조금 달라져 있다.", choices:[
        { text:"그래도 예전처럼 자연스럽게 어울린다.", type:"tango", points:3 },
        { text:"서로 어떻게 변했는지 이야기해본다.", type:"criss", points:3 },
        { text:"‘우리 다 변했네’ 하면서 분위기를 재미있게 만든다.", type:"l", points:2 },
        { text:"새로운 분위기에 맞춰서 나도 자연스럽게 변한다.", type:"warp", points:3 }
      ]}
    ];

    const LETTERS = ["A", "B", "C", "D"];
    const state = { current:0, answers:Array(QUESTIONS.length).fill(null) };
    const $ = (id) => document.getElementById(id);
    const show = (screenId) => {
      document.querySelectorAll(".screen").forEach((screen) => screen.classList.toggle("active", screen.id === screenId));
      window.scrollTo({ top:0, behavior:"smooth" });
    };

    function renderQuestion() {
      const question = QUESTIONS[state.current];
      $("counter").textContent = `${state.current + 1} / ${QUESTIONS.length}`;
      $("progress").style.width = `${((state.current + 1) / QUESTIONS.length) * 100}%`;
      $("questionLabel").textContent = `Q${state.current + 1}. 상황을 상상해 보세요`;
      $("questionText").textContent = question.text;
      $("answers").replaceChildren(...question.choices.map((choice, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.innerHTML = `<span class="letter">${LETTERS[index]}</span><span>${choice.text}</span>`;
        button.addEventListener("click", () => choose(index));
        return button;
      }));
      $("backButton").hidden = state.current === 0;
    }

    function choose(choiceIndex) {
      state.answers[state.current] = choiceIndex;
      if (state.current < QUESTIONS.length - 1) { state.current += 1; renderQuestion(); }
      else renderResult();
    }

    // 최고 점수 동점이면 Q7 → Q1 순으로 거꾸로 확인해, 더 최근에 점수를 얻은 유형을 선택합니다.
    function calculateResult(answers) {
      const scores = Object.fromEntries(Object.keys(TYPES).map((type) => [type, 0]));
      answers.forEach((choiceIndex, questionIndex) => {
        const choice = QUESTIONS[questionIndex].choices[choiceIndex];
        scores[choice.type] += choice.points;
      });
      const highest = Math.max(...Object.values(scores));
      const tied = Object.keys(scores).filter((type) => scores[type] === highest);
      let winner = tied[0];
      if (tied.length > 1) {
        for (let i = answers.length - 1; i >= 0; i -= 1) {
          const recentType = QUESTIONS[i].choices[answers[i]].type;
          if (tied.includes(recentType)) { winner = recentType; break; }
        }
      }
      return { winner, scores, tied };
    }

    function setResultImage(type) {
      const box = $("resultImage");
      box.className = "result-image no-image";
      box.style.setProperty("--fallback", type.color);
      box.dataset.icon = type.icon;
      box.replaceChildren();
      const image = new Image();
      image.alt = `${type.name} 결과 이미지`;
      image.onload = () => box.classList.remove("no-image");
      image.onerror = () => image.remove();
      image.src = type.image;
      box.append(image);
    }

    function renderResult() {
      const result = calculateResult(state.answers);
      const type = TYPES[result.winner];
      $("resultTitle").textContent = type.name;
      $("resultSubtitle").textContent = type.subtitle;
      $("description").textContent = type.description;
      $("traits").replaceChildren(...type.traits.map((trait) => { const item = document.createElement("span"); item.className = "trait"; item.textContent = trait; return item; }));
      setResultImage(type);
      const tieNote = $("tieNote");
      tieNote.hidden = result.tied.length < 2;
      tieNote.textContent = result.tied.length < 2 ? "" : "동점 유형이 있어 마지막에 선택한 성향을 더 반영했어요.";
      $("copyButton").dataset.copy = `나의 RIVALS 유형은 ${type.name}! ${type.subtitle}`;
      show("result");
    }

    $("startButton").addEventListener("click", () => { state.current = 0; state.answers.fill(null); renderQuestion(); show("quiz"); });
    $("backButton").addEventListener("click", () => { if (state.current > 0) { state.current -= 1; renderQuestion(); } });
    $("restartButton").addEventListener("click", () => $("startButton").click());
    $("copyButton").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      try { await navigator.clipboard.writeText(button.dataset.copy); button.textContent = "복사했어요!"; }
      catch { button.textContent = "복사할 문구: " + button.dataset.copy; }
      setTimeout(() => { button.textContent = "결과 문구 복사"; }, 1800);
    });

    // 브라우저 개발자 도구에서 RIVALS_TEST([0, 3, 1, 2, 1, 0, 3])처럼 호출해 점수표를 확인할 수 있습니다.
    window.RIVALS_TEST = calculateResult;
  </script>
</body>
</html>
